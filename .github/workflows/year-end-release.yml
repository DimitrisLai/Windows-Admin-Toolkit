name: Year-end v2.5.0 release packages

on:
  pull_request:
    paths:
      - README.md
      - YEAR_END_RELEASE_NOTES.md
      - release/package_v25.ps1
      - .github/workflows/year-end-release.yml
  push:
    branches: [main]
    paths:
      - README.md
      - YEAR_END_RELEASE_NOTES.md
      - release/package_v25.ps1
      - .github/workflows/year-end-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: year-end-v2.5.0-release
  cancel-in-progress: false

jobs:
  package-release:
    name: Test, package, and publish year-end public beta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify release version and 73 entries
        shell: pwsh
        run: |
          python -m compileall -q app.py command_catalog.py windows_launcher.py temp_cleaner.py tests
          python -c "from app import APP_VERSION; from command_catalog import COMMANDS; assert APP_VERSION == '2.5.0'; assert len(COMMANDS) == 73"
      - name: Run simulated-command unit tests
        run: python -m unittest discover -s tests -v
      - name: Build unsigned Windows application
        shell: cmd
        run: |
          python -m pip install "pyinstaller>=6,<7"
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name WindowsAdminToolkit --icon "assets\toolkit.ico" --add-data "assets\toolkit.ico;assets" app.py
      - name: Package versioned Windows/source/PDF archives and SHA-256
        shell: pwsh
        run: ./release/package_v25.ps1
      - name: Upload download candidates to Actions
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Admin-Toolkit-v2.5.0-all-downloads
          path: release-output/*
          if-no-files-found: error
      - name: Publish v2.5.0 GitHub prerelease once on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v2.5.0 --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "The v2.5.0 release already exists. Do not republish a frozen release."
            exit 0
          }
          gh release create v2.5.0 release-output/Windows-Admin-Toolkit-v2.5.0-Windows.zip release-output/Windows-Admin-Toolkit-v2.5.0-Source.zip release-output/Windows-Admin-Toolkit-v2.5.0-User-Manual.pdf release-output/SHA256SUMS.txt --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "v2.5.0 - 2026 feature-complete public beta" --notes-file YEAR_END_RELEASE_NOTES.md --prerelease
