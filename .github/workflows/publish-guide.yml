name: Build and publish PDF manual

on:
  push:
    branches: [main]
    paths:
      - "docs/build_pdf.py"
      - "USER_MANUAL.md"
      - "COMMAND_REFERENCE.md"
      - ".github/workflows/publish-guide.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pdf-manual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF dependencies
        run: python -m pip install "mistune==3.2.0" "weasyprint==68.0"
      - name: Generate handbook from source documentation
        run: python docs/build_pdf.py
      - name: Upload PDF as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Admin-Toolkit-Detailed-Guide
          path: docs/Windows_Admin_Toolkit_Detailed_Guide.pdf
      - name: Commit refreshed PDF into the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/Windows_Admin_Toolkit_Detailed_Guide.pdf
          if git diff --cached --quiet; then
            echo "PDF unchanged."
          else
            git commit -m "docs: refresh complete Windows Admin Toolkit PDF handbook"
            git push origin HEAD:main
          fi
